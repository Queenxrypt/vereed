[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.30"
# via_ir required: ASCBase + EvmV1Decoder hit "stack too deep" without it (same as official examples).
via_ir = true
optimizer = true
optimizer_runs = 200
evm_version = "shanghai"
verbosity = 2
allow_paths = ["attestcoin-protocol-examples/node_modules"]
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@gluwa/asc-contracts/=attestcoin-protocol-examples/node_modules/@gluwa/asc-contracts/",
]

[lint]
lint_on_build = false
